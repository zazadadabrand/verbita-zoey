const STORAGE_KEY = "verbita_save";

function loadSave() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // Check if streak should reset (missed a day)
    const lastDate = data.lastPracticeDate;
    const today = new Date().toDateString();
    if (lastDate && lastDate !== today) {
      const last = new Date(lastDate);
      const now = new Date();
      const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
      if (diffDays > 1) data.streak = 0; // Streak broken
    }
    return data;
  } catch { return null; }
}

function writeSave(stats) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      ...stats,
      lastPracticeDate: new Date().toDateString(),
    }));
  } catch {}
}

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   SMART SENTENCE CHECKER
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */
function checkSentence(placed, question) {
  const attempt = placed.join(" ");
  const attemptLower = placed.map(w => w.toLowerCase()).join(" ");

  for (const accepted of question.accepted) {
    if (accepted.join(" ") === attempt) return { correct: true };
    // Also check case-insensitive
    if (accepted.map(w => w.toLowerCase()).join(" ") === attemptLower) return { correct: true };
  }

  // Smart error detection
  const best = question.accepted[0];
  const errors = [];

  // Check if it's a word-order issue with articles/prepositions
  const placedSet = placed.map(w => w.toLowerCase()).sort().join(",");
  const bestSet = best.map(w => w.toLowerCase()).sort().join(",");
  if (placedSet === bestSet) {
    // Same words, different order &#8212; check what's wrong
    const verbIdx = best.findIndex(w => question.words.indexOf(w) !== -1 &&
      /[&#243;&#233;&#237;&#225;&#250;]|amos|emos|imos|an|en|as|es/.test(w));

    // Check if subject-verb order is off
    const pronouns = ["yo", "t\u00fa", "\u00e9l", "ella", "nosotros", "ellos", "ellas"];
    const firstPlaced = placed[0].toLowerCase();
    const firstBest = best[0].toLowerCase();

    if (pronouns.includes(firstPlaced) && !pronouns.includes(firstBest)) {
      errors.push("Try putting the time expression first \u2014 in Spanish, time words often lead the sentence.");
    } else if (/^(en|a|con|de|del|al)$/.test(firstPlaced)) {
      errors.push("Prepositions like '" + placed[0] + "' usually go in the middle, not at the start.");
    } else {
      errors.push("The words are right but the order needs adjusting. Try a different arrangement!");
    }
  } else {
    errors.push("Check which words you've placed \u2014 something seems off.");
  }

  return { correct: false, errors };
}

   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */
const IRREGULAR_PRETERITO = [
  "fui", "fue", "fuimos", "fueron", "fuiste",
  "hice", "hizo", "hicimos", "hicieron", "hiciste",
  "dije", "dijo", "dijimos", "dijeron", "dijiste",

  "quise", "quiso", "quisimos", "quisieron",
  "traje", "trajo", "trajimos", "trajeron",
  "vi", "vio", "vimos", "vieron", "viste",
  "di", "dio", "dimos", "dieron", "diste",
];

const IRREGULAR_PRESENTE = [
  "soy", "eres", "es", "somos", "son",
  "tengo", "tienes", "tiene", "tenemos", "tienen",
  "voy", "vas", "va", "vamos", "van",
  "hago", "haces", "hace", "hacemos", "hacen",
  "digo", "dices", "dice", "decimos", "dicen",
  "salgo", "sales", "sale", "salimos", "salen",

  "s\u00e9", "sabes", "sabe", "sabemos", "saben",
  "pongo", "pones", "pone", "ponemos", "ponen",
  "vengo", "vienes", "viene", "venimos", "vienen",
  "quiero", "quieres", "quiere", "queremos", "quieren",
  "puedo", "puedes", "puede", "podemos", "pueden",
];

function analyzeSpoken(text, question) {
  const lower = text.toLowerCase().normalize("NFD").replace(/[\u0301]/g, "");
  const words = lower.split(/\s+/);
  const result = { transcript: text, tenseCorrect: false, corrections: [], praise: "" };

  // Regular ending patterns
  const preteritoEndings = /(e|aste|o|amos|aron|ieron|imos|iste)$/;
  const imperfectoEndings = /(aba|abas|&#225;bamos|aban|&#237;a|&#237;as|&#237;amos|&#237;an)$/;
  const presenteEndings = /(o|as|es|a|e|amos|emos|imos|an|en)$/;

  let preteritoScore = 0, presenteScore = 0, imperfectoScore = 0;

  words.forEach(w => {
    const clean = w.replace(/[.,!?&#191;&#161;]/g, "");
    if (IRREGULAR_PRETERITO.includes(clean)) preteritoScore += 3;
    if (IRREGULAR_PRESENTE.includes(clean)) presenteScore += 3;
    if (preteritoEndings.test(clean) && clean.length > 3) preteritoScore += 1;
    if (imperfectoEndings.test(clean) && clean.length > 4) imperfectoScore += 2;
  });

  const expected = question.expectedTense;
  if (expected === "Pret\u00e9rito") {
    result.tenseCorrect = preteritoScore >= 2;
    result.praise = result.tenseCorrect
      ? "You nailed the pret\u00e9rito! Your past tense verb forms are spot on for talking about completed actions."
      : "Hmm, I didn't hear clear pret\u00e9rito forms. Try using verbs ending in -\u00e9, -aste, -\u00f3, -amos, -aron, or irregulars like 'fui', 'hice', 'vi'.";
  } else if (expected === "Presente") {
    result.tenseCorrect = presenteScore >= 2 || (preteritoScore === 0 && imperfectoScore === 0 && words.length > 3);
    result.praise = result.tenseCorrect
      ? "Great use of the presente! Your verb forms correctly describe current habits and routines."
      : "I'm not sure I heard present tense forms. For routines, use endings like -o, -as, -a, -amos, -an.";
  }

  // Grammar checks
  if (/\bcon mi [a-z&#225;&#233;&#237;&#243;&#250;]+s\b/i.test(text)) {
    result.corrections.push({
      issue: "con mi + plural noun",
      fix: "con mis + plural noun",
      explanation: "Use 'mis' (plural) when the noun is plural. 'Mi' is only for singular nouns.",
    });
  }
  if (/\byo [a-z&#225;&#233;&#237;&#243;&#250;]+mos\b/i.test(text)) {
    result.corrections.push({
      issue: "yo + -mos verb",
      fix: "nosotros + -mos verb",
      explanation: "'Yo' is 'I' \u2014 verbs ending in -mos are 'we' (nosotros). Use 'yo' with -o/-\u00e9/-\u00ed endings.",
    });
  }
  if (/\bel [a-z&#225;&#233;&#237;&#243;&#250;]*a\b/i.test(text) && /\b(la casa|la mesa|la escuela|la cena|la playa)\b/i.test("el " + text.split("el ")[1]?.split(" ")[0])) {
    // Basic article-noun gender check (simplified)
  }
  if (/\ba el\b/i.test(text)) {
    result.corrections.push({
      issue: "a el",
      fix: "al",
      explanation: "'A' + 'el' contracts to 'al' in Spanish. For example: 'Fui al parque' not 'Fui a el parque'.",
    });
  }
  if (/\bde el\b/i.test(text)) {
    result.corrections.push({
      issue: "de el",
      fix: "del",
      explanation: "'De' + 'el' contracts to 'del' in Spanish. For example: 'cerca del parque' not 'cerca de el parque'.",
    });
  }

  return result;
}

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   SENTENCE BUILDER &#8212; with flexible ordering + smart errors
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */
const SentenceBuilderScreen = ({ onBack, onCorrect }) => {
  const { C } = useTheme();
  const [qIndex, setQIndex] = useState(() => Math.floor(Math.random() * sentenceBuilderBank.length));
  const [placed, setPlaced] = useState([]);
  const [available, setAvailable] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const [showHint, setShowHint] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const q = sentenceBuilderBank[qIndex];

  useEffect(() => {
    setAvailable([...q.words].sort(() => Math.random() - 0.5));
    setPlaced([]); setFeedback(null); setShowHint(false); setAttempts(0);
  }, [qIndex]);

  const handleTap = (word, idx) => { setPlaced([...placed, word]); setAvailable(available.filter((_, i) => i !== idx)); setFeedback(null); };
  const handleRemove = (idx) => { setAvailable([...available, placed[idx]]); setPlaced(placed.filter((_, i) => i !== idx)); setFeedback(null); };

  const handleCheck = () => {
    const result = checkSentence(placed, q);
    if (result.correct) {
      setFeedback({ type: "correct" });
      onCorrect(q.xp, q.tenseCat);
    } else {
      setFeedback({ type: "wrong", errors: result.errors });
      setShowHint(true); // reveal hint after first wrong answer
      setAttempts(attempts + 1);
    }
  };

  const handleNext = () => {
    let next;
    do { next = Math.floor(Math.random() * sentenceBuilderBank.length); } while (next === qIndex && sentenceBuilderBank.length > 1);
    setQIndex(next);
  };

  return (
    <div style={{ padding: "0 20px 20px" }}>
      <BackButton onClick={onBack} />
      <ScreenHeader emoji="\u270f\ufe0f" title="Build the Sentence" subtitle="Tap words in the right order" />
      <ProgressDots current={qIndex % 5} total={5} />
      <HintCard forceShow={showHint}>{q.words.includes("Ayer") || q.words.includes("Anoche") || q.words.includes("El") ? q.tense === "pret\u00e9rito" ? "You're talking about the past \u2014 use the pret\u00e9rito! Time words can go first or last." : "This is a routine \u2014 use the presente!" : "Think about when this action happens \u2014 that tells you the tense."}</HintCard>

      <div style={{ textAlign: "center", marginBottom: 16, padding: 12, background: C.bgSoft, borderRadius: 14 }}>
        <div style={{ fontSize: 11, color: C.textMuted, fontWeight: 700, marginBottom: 4 }}>TRANSLATE:</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: C.text }}>"{q.english}"</div>
      </div>

      <Card style={{ minHeight: 70, marginBottom: 16, border: `2px dashed ${C.pinkLight}`, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", padding: 16 }}>
        {placed.length === 0 && <span style={{ color: C.textMuted, fontSize: 13, fontStyle: "italic" }}>Tap words below to build your sentence...</span>}
        {placed.map((word, i) => (
          <button key={i} onClick={() => handleRemove(i)} style={{ background: C.lavender, color: "#fff", border: "none", borderRadius: 12, padding: "8px 14px", fontSize: 15, fontWeight: 700 }}>{word}</button>
        ))}
      </Card>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginBottom: 20 }}>
        {available.map((word, i) => (
          <button key={i} onClick={() => handleTap(word, i)} style={{ background: C.card, color: C.text, border: `2px solid ${C.pinkLight}`, borderRadius: 12, padding: "8px 14px", fontSize: 15, fontWeight: 700 }}>{word}</button>
        ))}
      </div>

      {feedback?.type === "correct" && (
        <div><CorrectCard xp={q.xp}>{q.verbExplain}</CorrectCard><PrimaryButton onClick={handleNext}>Next Sentence &#8594;</PrimaryButton></div>
      )}
      {feedback?.type === "wrong" && (
        <WrongCard onRetry={() => { setAvailable([...available, ...placed].sort(() => Math.random() - 0.5)); setPlaced([]); setFeedback(null); }}>
          {feedback.errors?.[0] || "Not quite \u2014 try rearranging the words!"}
          {attempts >= 2 && <div style={{ marginTop: 8, fontSize: 11, color: C.textMuted }}>Tip: One correct order is: "{q.accepted[0].join(" ")}"</div>}
        </WrongCard>
      )}

      {!feedback && (
        <div style={{ display: "flex", gap: 10 }}>
          <SecondaryButton onClick={() => { setAvailable([...available, ...placed].sort(() => Math.random() - 0.5)); setPlaced([]); }} style={{ flex: 1 }}>Reset</SecondaryButton>
          <PrimaryButton onClick={handleCheck} disabled={placed.length === 0} style={{ flex: 2 }}>Check &#10024;</PrimaryButton>
        </div>
      )}
    </div>
  );
};

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   TENSE SPOTTER &#8212; progressive hints
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */

const DUCK_LEVELS = [
  { level: 1, xpRequired: 0, accessories: ["default", "tiny-bow"] },
  { level: 2, xpRequired: 50, accessories: ["party-hat", "flower-crown"] },
  { level: 3, xpRequired: 150, accessories: ["sunglasses", "sparkle-trail"] },
  { level: 4, xpRequired: 300, accessories: ["unicorn-horn", "crown"] },
  { level: 5, xpRequired: 500, accessories: ["wizard-hat", "wings"] },
  { level: 6, xpRequired: 750, accessories: ["tiara", "dj-headphones"] },
  { level: 7, xpRequired: 1000, accessories: ["rainbow-aura"] },
];

const ACCESSORY_INFO = {
  "default": { name: "Default Duck", emoji: "&#129412;" },
  "tiny-bow": { name: "Tiny Bow", emoji: "&#127999;" },
  "party-hat": { name: "Party Hat", emoji: "&#127881;" },
  "flower-crown": { name: "Flower Crown", emoji: "&#127799;" },
  "sunglasses": { name: "Sunglasses", emoji: "&#128522;" },
  "sparkle-trail": { name: "Sparkle Trail", emoji: "&#10024;" },
  "unicorn-horn": { name: "Unicorn Horn", emoji: "&#129412;" },
  "crown": { name: "Crown", emoji: "&#128081;" },
  "wizard-hat": { name: "Wizard Hat", emoji: "&#129381;" },
  "wings": { name: "Wings", emoji: "&#129412;" },
  "tiara": { name: "Tiara", emoji: "&#128091;" },
  "dj-headphones": { name: "DJ Headphones", emoji: "&#127911;" },
  "rainbow-aura": { name: "Rainbow Aura", emoji: "&#128800;" },
};

function getDuckLevel(xp) {
  for (let i = DUCK_LEVELS.length - 1; i >= 0; i--) {
    if (xp >= DUCK_LEVELS[i].xpRequired) return i + 1;
  }
  return 1;
}

function getXpToNextLevel(xp) {
  const currentLevel = getDuckLevel(xp);
  if (currentLevel >= DUCK_LEVELS.length) return 0;
  return DUCK_LEVELS[currentLevel].xpRequired - xp;
}

function getUnlockedAccessories(xp) {
  const level = getDuckLevel(xp);
  const unlocked = new Set();
  for (let i = 0; i < level && i < DUCK_LEVELS.length; i++) {
    DUCK_LEVELS[i].accessories.forEach(a => unlocked.add(a));
  }
  return unlocked;
}

const DuckRenderer = ({ equipped, size = 80 }) => {
  const style = { position: "relative", width: size, height: size, display: "flex", alignItems: "center", justifyContent: "center" };
  return (
    <div style={style}>
      <div style={{ fontSize: size * 0.9, lineHeight: 1 }}>&#129412;</div>
      {equipped === "tiny-bow" && <div style={{ position: "absolute", top: "-8px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.4 }}>&#127999;</div>}
      {equipped === "party-hat" && <div style={{ position: "absolute", top: "-12px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.5 }}>&#127881;</div>}
      {equipped === "flower-crown" && <div style={{ position: "absolute", top: "-10px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.5 }}>&#127799;</div>}
      {equipped === "sunglasses" && <div style={{ position: "absolute", top: "20px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.35 }}>&#128522;</div>}
      {equipped === "sparkle-trail" && (<><div style={{ position: "absolute", top: "10px", left: "10px", fontSize: size * 0.3 }}>&#10024;</div><div style={{ position: "absolute", top: "30px", right: "10px", fontSize: size * 0.3 }}>&#10024;</div><div style={{ position: "absolute", bottom: "10px", left: "20px", fontSize: size * 0.3 }}>&#10024;</div></>)}
      {equipped === "crown" && <div style={{ position: "absolute", top: "-8px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.5 }}>&#128081;</div>}
      {equipped === "wizard-hat" && <div style={{ position: "absolute", top: "-12px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.5 }}>&#129381;</div>}
      {equipped === "wings" && (<><div style={{ position: "absolute", left: "-25px", top: "50%", transform: "translateY(-50%)", fontSize: size * 0.4 }}>&#10024;</div><div style={{ position: "absolute", right: "-25px", top: "50%", transform: "translateY(-50%)", fontSize: size * 0.4 }}>&#10024;</div></>)}
      {equipped === "tiara" && <div style={{ position: "absolute", top: "-6px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.45 }}>&#128091;</div>}
      {equipped === "dj-headphones" && <div style={{ position: "absolute", top: "-2px", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.5 }}>&#127911;</div>}
      {equipped === "rainbow-aura" && <div style={{ position: "absolute", inset: "-15px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.6, opacity: 0.8 }}>&#128800;</div>}
    </div>
  );
};

const DuckScreen = ({ onBack, stats }) => {
  const C = useTheme().C;
  const [duckState, setDuckState] = useState(() => {
    const saved = localStorage.getItem("duck_state");
    return saved ? JSON.parse(saved) : { name: "Quackers", equippedAccessory: "default" };
  });

  useEffect(() => {
    localStorage.setItem("duck_state", JSON.stringify(duckState));
  }, [duckState]);

  const currentLevel = getDuckLevel(stats.xp);
  const unlockedAccessories = getUnlockedAccessories(stats.xp);
  const allAccessories = Object.keys(ACCESSORY_INFO);
  const isMaxLevel = currentLevel >= DUCK_LEVELS.length;
  const xpToNext = getXpToNextLevel(stats.xp);

  const handleEquip = (acc) => setDuckState(prev => ({ ...prev, equippedAccessory: acc }));
  const handleRename = () => {
    const newName = prompt("Name your duck:", duckState.name);
    if (newName && newName.trim()) setDuckState(prev => ({ ...prev, name: newName.trim() }));
  };

  return (
    <div style={{ padding: "20px", animation: "fadeIn 0.3s ease-out" }}>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.text, cursor: "pointer", fontSize: 18, marginBottom: 20 }}>&#8617; Back</button>
      <div style={{ background: C.card, borderRadius: 16, padding: "30px 20px", textAlign: "center", marginBottom: 20, boxShadow: `0 4px 12px ${C.shadow}` }}>
        <div style={{ marginBottom: 20 }}><DuckRenderer equipped={duckState.equippedAccessory} size={100} /></div>
        <h2 style={{ color: C.text, marginBottom: 8, fontSize: 20 }}>{duckState.name} &#129412;</h2>
        <button onClick={handleRename} style={{ background: C.pink, border: "none", color: C.white, padding: "8px 14px", borderRadius: 8, cursor: "pointer", fontSize: 12, fontWeight: 600, marginBottom: 16 }}>Rename</button>
        <div style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Level {currentLevel}</div>
        <div style={{ background: C.bgSoft, height: 12, borderRadius: 8, overflow: "hidden", marginBottom: 6 }}>
          <div style={{ background: C.lavender, height: "100%", width: isMaxLevel ? "100%" : "50%", transition: "width 0.3s ease" }} />
        </div>
        <div style={{ color: C.textMuted, fontSize: 12 }}>{isMaxLevel ? "Max level!" : `${xpToNext} XP to next`}</div>
      </div>
      <h3 style={{ color: C.text, fontSize: 14, fontWeight: 700, marginBottom: 12 }}>Accessories</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
        {allAccessories.map(acc => {
          const isUnlocked = unlockedAccessories.has(acc);
          const isEquipped = duckState.equippedAccessory === acc;
          return (
            <button
              key={acc}
              onClick={() => isUnlocked && handleEquip(acc)}
              disabled={!isUnlocked}
              style={{ background: isEquipped ? C.pink : C.bgSoft, border: isEquipped ? `2px solid ${C.pinkDark}` : none, borderRadius: 12, padding: 12, cursor: isUnlocked ? "pointer" : "not-allowed", opacity: isUnlocked ? 1 : 0.5 }}
            >
              <div style={{ fontSize: 32, marginBottom: 4 }}>{ACCESSORY_INFO[acc].emoji}</div>
              <div style={{ fontSize: 10, fontWeight: 600, color: C.text }}>{ACCESSORY_INFO[acc].name}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
};

const TenseSpotterScreen = ({ onBack, onCorrect }) => {
  const { C } = useTheme();
  const [qIndex, setQIndex] = useState(() => Math.floor(Math.random() * tenseSpotterBank.length));
  const [selected, setSelected] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [showHint, setShowHint] = useState(false);
  const q = tenseSpotterBank[qIndex];
  const tenses = ["Presente", "Pret\u00e9rito"];

  const handleSelect = (tense) => {
    if (feedback) return;
    setSelected(tense);
    const isCorrect = tense === q.correct;
    setFeedback(isCorrect ? "correct" : "wrong");
    if (isCorrect) onCorrect(q.xp, q.tenseCat);
    if (!isCorrect) setShowHint(true);
  };

  const handleNext = () => {
    let next; do { next = Math.floor(Math.random() * tenseSpotterBank.length); } while (next === qIndex && tenseSpotterBank.length > 1);
    setQIndex(next); setSelected(null); setFeedback(null); setShowHint(false);
  };

  return (
    <div style={{ padding: "0 20px 20px" }}>
      <BackButton onClick={onBack} />
      <ScreenHeader emoji="\ud83e\udde9" title="Tense Spotter" subtitle="What tense are the highlighted verbs?" />

      <Card style={{ marginBottom: 16, padding: 20 }}>
        <div style={{ fontSize: 18, lineHeight: 1.7, color: C.text }}>
          {q.parts.map((p, i) => p.v
            ? <span key={i} style={{ background: C.lavenderLight, color: C.lavender, fontWeight: 800, padding: "2px 6px", borderRadius: 6 }}>{p.text}</span>
            : <span key={i}>{p.text}</span>
          )}
        </div>
        <div style={{ marginTop: 10, fontSize: 13, color: C.textMuted, fontStyle: "italic" }}>{q.translation}</div>
      </Card>

      <HintCard forceShow={showHint}>
        Look at the verb endings and the context clues. Time markers like "ayer," "siempre," "cuando era" tell you the tense!
      </HintCard>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
        {tenses.map((t) => {
          const isSel = selected === t;
          const isRight = feedback === "correct" && isSel;
          const isWrong = feedback === "wrong" && isSel;
          return (
            <button key={t} onClick={() => handleSelect(t)} style={{
              background: isRight ? C.correct : isWrong ? C.incorrect : C.card,
              color: (isRight || isWrong) ? "#fff" : C.text,
              border: `2px solid ${isRight ? C.correct : isWrong ? C.incorrect : C.lavenderLight}`,
              borderRadius: 14, padding: "14px 0", fontSize: 15, fontWeight: 700,
              cursor: feedback ? "default" : "pointer", transition: "all 0.2s ease",
            }}>{isRight && "\u2713 "}{t}</button>
          );
        })}
      </div>

      {feedback === "correct" && <div><CorrectCard xp={q.xp}>{q.explanation}</CorrectCard><PrimaryButton onClick={handleNext}>Next Question &#8594;</PrimaryButton></div>}
      {feedback === "wrong" && <WrongCard onRetry={() => { setSelected(null); setFeedback(null); }}>Think about it &#8212; look at the verb endings and context clues in the sentence!</WrongCard>}
    </div>
  );
};

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   CHAT CON AMIGOS &#8212; tense labels HIDDEN until feedback
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */
const ChatScreen = ({ onBack, onCorrect }) => {
  const { C } = useTheme();
  const [qIndex, setQIndex] = useState(() => Math.floor(Math.random() * chatBank.length));
  const [messages, setMessages] = useState([]);
  const [answered, setAnswered] = useState(false);
  const q = chatBank[qIndex];

  useEffect(() => {
    setMessages([{ from: "friend", text: q.message, translation: q.translation }]);
    setAnswered(false);
  }, [qIndex]);

  const handleSelect = (idx) => {
    if (answered) return;
    setAnswered(true);
    const chosen = q.options[idx];
    setMessages(prev => [
      ...prev,
      { from: "you", text: chosen.text, correct: chosen.correct },
      { from: "system", text: chosen.correct ? q.correctExplain : q.wrongExplain, xp: chosen.correct ? q.xp : null,
        // Show all options with their tenses in the feedback
        reveal: q.options.map(o => `${o.text} \u2192 ${o.tense}`).join(" | "),
      },
    ]);
    if (chosen.correct) onCorrect(q.xp, q.tenseCat);
  };

  const handleNext = () => {
    let next; do { next = Math.floor(Math.random() * chatBank.length); } while (next === qIndex && chatBank.length > 1);
    setQIndex(next);
  };

  return (
    <div style={{ padding: "0 20px 20px" }}>
      <BackButton onClick={onBack} />
      <ScreenHeader emoji="\ud83d\udcac" title="Chat con Amigos" subtitle="Reply using the right tense!" />

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
        {messages.map((msg, i) => {
          if (msg.from === "friend") return (
            <div key={i} style={{ alignSelf: "flex-start", maxWidth: "80%" }} className="fade-in">
              <div style={{ background: C.card, border: `2px solid ${C.lavenderLight}`, borderRadius: "18px 18px 18px 4px", padding: "12px 16px" }}>
                <div style={{ fontSize: 14, color: C.text }}>{msg.text}</div>
                <div style={{ fontSize: 11, color: C.textMuted, fontStyle: "italic", marginTop: 4 }}>{msg.translation}</div>
              </div>
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 4, marginLeft: 4 }}>{q.friendEmoji} {q.friendName}</div>
            </div>
          );
          if (msg.from === "you") return (
            <div key={i} style={{ alignSelf: "flex-end", maxWidth: "80%" }} className="fade-in">
              <div style={{ background: msg.correct ? C.mint : C.incorrect, borderRadius: "18px 18px 4px 18px", padding: "12px 16px" }}>
                <div style={{ fontSize: 14, color: msg.correct ? C.text : "#fff" }}>{msg.text}</div>
              </div>
            </div>
          );
          if (msg.from === "system") return (
            <Card key={i} style={{ background: msg.xp ? `${C.correct}15` : `${C.yellow}22`, padding: 12, border: `1px solid ${msg.xp ? C.correct : C.yellow}` }}>
              <div style={{ fontSize: 13, color: C.text, lineHeight: 1.4 }}>{msg.text}</div>
              {msg.reveal && <div style={{ fontSize: 11, color: C.textMuted, marginTop: 8, borderTop: `1px solid ${C.bgSoft}`, paddingTop: 6 }}>&#128221; {msg.reveal}</div>}
              {msg.xp && <XPBadge xp={msg.xp} />}
            </Card>
          );
          return null;
        })}
      </div>

      {/* Options &#8212; NO tense labels shown */}
      {!answered && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }} className="fade-in">
          <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textAlign: "center" }}>Choose your reply:</div>
          {q.options.map((opt, i) => (
            <button key={i} onClick={() => handleSelect(i)} style={{
              background: C.card, border: `2px solid ${C.pinkLight}`, borderRadius: 14,
              padding: "12px 16px", fontSize: 14, color: C.text, textAlign: "left", transition: "all 0.15s ease",
            }}>{opt.text}</button>
          ))}
        </div>
      )}
      {answered && <PrimaryButton onClick={handleNext} style={{ marginTop: 8 }}>Next Chat &#8594;</PrimaryButton>}
    </div>
  );
};

/* &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
   TIMELINE CHALLENGE
   &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; */

const SpeakCheckScreen = ({ onBack, onCorrect }) => {
  const { C } = useTheme();
  const [qIndex, setQIndex] = useState(() => Math.floor(Math.random() * speakCheckBank.length));
  const [phase, setPhase] = useState("prompt");
  const [transcript, setTranscript] = useState("");
  const [dots, setDots] = useState(0);
  const [listenSec, setListenSec] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const recognitionRef = useRef(null);
  const q = speakCheckBank[qIndex];

  useEffect(() => {
    if (phase === "listening") {
      const d = setInterval(() => setDots(x => (x + 1) % 4), 400);
      const t = setInterval(() => setListenSec(x => x + 1), 1000);
      return () => { clearInterval(d); clearInterval(t); };
    }
  }, [phase]);

  useEffect(() => {
    if (phase === "processing") {
      const timer = setTimeout(() => {
        if (transcript) {
          const result = analyzeSpoken(transcript, q);
          setFeedback(result);
          if (result.tenseCorrect) onCorrect(q.xp, q.tenseCat);
        }
        setPhase("feedback");
      }, 1200);
      return () => clearTimeout(timer);
    }
  }, [phase]);

  const startListening = () => {
    setTranscript(""); setListenSec(0); setFeedback(null);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setPhase("noSpeech"); return; }
    const r = new SR();
    r.lang = "es-ES"; r.interimResults = false; r.continuous = true;
    r.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; setTranscript(t); };
    r.onerror = (e) => { if (e.error === "not-allowed") setPhase("noSpeech"); };
    recognitionRef.current = r; r.start(); setPhase("listening");
  };

  const stopListening = () => {
    if (recognitionRef.current) recognitionRef.current.stop();
    setTimeout(() => setPhase("processing"), 300);
  };

  const speakSample = () => {
    const u = new SpeechSynthesisUtterance(q.sampleAnswer);
    u.lang = "es-ES"; u.rate = 0.85; window.speechSynthesis.speak(u);
  };

  const handleNext = () => {
    let next; do { next = Math.floor(Math.random() * speakCheckBank.length); } while (next === qIndex && speakCheckBank.length > 1);
    setQIndex(next); setPhase("prompt"); setTranscript(""); setFeedback(null);
  };

  const MicBars = () => (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 3, height: 40 }}>
      {[0,1,2,3,4,5,6].map(i => (
        <div key={i} style={{ width: 4, borderRadius: 2, background: C.pink, height: `${12 + Math.sin((dots * 0.8) + i * 0.9) * 12 + 12}px`, transition: "height 0.15s ease" }} />
      ))}
    </div>
  );

  return (
    <div style={{ padding: "0 20px 20px" }}>
      <BackButton onClick={onBack} />
      <ScreenHeader emoji="\ud83c\udf99\ufe0f" title="Habla y Revisa" subtitle="Speak your answer \u2014 I'll give you feedback!" />

      <Card style={{ marginBottom: 16, border: `2px solid ${C.lavenderLight}`, textAlign: "center" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, marginBottom: 6 }}>ANSWER THIS:</div>
        <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 4 }}>{q.question}</div>
        <div style={{ fontSize: 13, color: C.textMuted, fontStyle: "italic" }}>{q.translation}</div>
      </Card>

      <HintCard>{q.hint}</HintCard>

      {phase === "prompt" && (
        <div style={{ textAlign: "center", marginBottom: 20 }} className="fade-in">
          <button onClick={startListening} className="pulse" style={{
            width: 80, height: 80, borderRadius: 40, background: `linear-gradient(135deg, ${C.pink}, ${C.pinkDark || C.pink})`,
            border: "none", display: "flex", alignItems: "center", justifyContent: "center",
            margin: "0 auto 12px", boxShadow: `0 4px 20px ${C.pink}66`, fontSize: 32,
          }}>&#127908;</button>
          <div style={{ fontSize: 13, color: C.textLight }}>Tap to start speaking</div>
        </div>
      )}

      {phase === "noSpeech" && (
        <Card style={{ textAlign: "center", marginBottom: 16, border: `2px solid ${C.yellow}` }}>
          <div style={{ fontSize: 24, marginBottom: 8 }}>&#128263;</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 4 }}>Speech not available</div>
          <div style={{ fontSize: 12, color: C.textLight, marginBottom: 12 }}>Try opening this in Chrome and allowing mic access!</div>
          <div style={{ fontSize: 14, color: C.text, fontStyle: "italic", marginBottom: 12 }}>Model answer: "{q.sampleAnswer}"</div>
          <button onClick={speakSample} style={{ background: C.lavender, color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700 }}>&#128266; Hear it</button>
          <div style={{ marginTop: 12 }}><PrimaryButton onClick={handleNext}>Next &#8594;</PrimaryButton></div>
        </Card>
      )}

      {phase === "listening" && (
        <div style={{ textAlign: "center", marginBottom: 20 }} className="fade-in">
          <Card style={{ background: `${C.pink}11`, border: `2px solid ${C.pink}`, padding: 20 }}>
            <MicBars />
            <div style={{ fontSize: 14, fontWeight: 700, color: C.pink, marginTop: 8 }}>Listening{".".repeat(dots)}</div>
            <div style={{ fontSize: 12, color: C.textMuted, marginTop: 4 }}>{listenSec}s &#8212; take your time!</div>
          </Card>
          <button onClick={stopListening} className="mic-pulse" style={{
            marginTop: 12, width: 60, height: 60, borderRadius: 30, background: C.pink, border: "none",
            display: "flex", alignItems: "center", justifyContent: "center", margin: "12px auto 0",
          }}><div style={{ width: 20, height: 20, borderRadius: 4, background: "#fff" }} /></button>
          <div style={{ fontSize: 12, color: C.textMuted, marginTop: 8 }}>Tap to stop</div>
        </div>
      )}

      {phase === "processing" && (
        <div style={{ textAlign: "center", padding: 30 }} className="fade-in">
          <div style={{ fontSize: 28, marginBottom: 8 }}>&#129300;</div>
          <div style={{ fontSize: 14, color: C.textLight }}>Analyzing your response...</div>
        </div>
      )}

      {phase === "feedback" && feedback && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }} className="fade-in">
          <Card style={{ background: C.bgSoft, padding: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, marginBottom: 4 }}>WHAT YOU SAID:</div>
            <div style={{ fontSize: 15, color: C.text, fontStyle: "italic" }}>"{feedback.transcript}"</div>
          </Card>

          <Card style={{ background: feedback.tenseCorrect ? `${C.correct}15` : `${C.yellow}22`, border: `2px solid ${feedback.tenseCorrect ? C.correct : C.yellow}`, padding: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <span style={{ fontSize: 18 }}>{feedback.tenseCorrect ? "\u2705" : "\ud83d\udca1"}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>Tense: {q.expectedTense} {feedback.tenseCorrect ? "\u2713" : "\u2014 keep practicing"}</span>
            </div>
            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.5 }}>{feedback.praise}</div>
          </Card>

          {feedback.corrections.map((c, i) => (
            <Card key={i} style={{ background: `${C.yellow}22`, border: `2px solid ${C.yellow}`, padding: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 8 }}>&#9999;&#65039; Small fix:</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ background: `${C.incorrect}33`, padding: "4px 10px", borderRadius: 8, fontSize: 14, textDecoration: "line-through", color: C.text }}>{c.issue}</span>
                <span style={{ color: C.text }}>&#8594;</span>
                <span style={{ background: `${C.correct}33`, padding: "4px 10px", borderRadius: 8, fontSize: 14, fontWeight: 700, color: C.text }}>{c.fix}</span>
              </div>
              <div style={{ fontSize: 13, color: C.textLight, lineHeight: 1.4 }}>{c.explanation}</div>
            </Card>
          ))}

          <Card style={{ background: C.lavenderLight, padding: 14, border: `2px solid ${C.lavender}` }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, marginBottom: 4 }}>&#127775; MODEL ANSWER:</div>
            <div style={{ fontSize: 14, color: C.text, lineHeight: 1.5, fontStyle: "italic" }}>"{q.sampleAnswer}"</div>
            <button onClick={speakSample} style={{ marginTop: 8, background: C.lavender, color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontSize: 12, fontWeight: 700 }}>&#128266; Hear it spoken</button>
          </Card>

          {feedback.tenseCorrect && <XPBadge xp={q.xp} />}
          <div style={{ display: "flex", gap: 10 }}>
            <SecondaryButton onClick={() => { setPhase("prompt"); setTranscript(""); setFeedback(null); }} style={{ flex: 1 }}>Try Again</SecondaryButton>
            <PrimaryButton onClick={handleNext} style={{ flex: 2 }}>Next Question &#8594;</PrimaryButton>
          </div>
        </div>
      )}

      {phase === "feedback" && !feedback && (
        <Card style={{ textAlign: "center" }}>
          <div style={{ fontSize: 14, color: C.textLight }}>I didn't catch anything \u2014 try speaking a bit louder or closer to the mic!</div>
          <button onClick={() => setPhase("prompt")} style={{ marginTop: 10, background: C.pink, color: "#fff", border: "none", borderRadius: 10, padding: "8px 20px", fontSize: 13, fontWeight: 700 }}>Try Again</button>
        </Card>
      )}
    </div>
  );
};

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   MAIN APP
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
function App() {
  const [screen, setScreen] = useState("home");
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem("verbita_dark") === "true"; } catch { return false; }
  });

  const [stats, setStats] = useState(() => {
    const saved = loadSave();
    return saved || {
      streak: 0, xp: 0, exercisesDone: 0,
      tenseProgress: { presente: 0, preterito: 0 },
      lastPracticeDate: null,
    };
  });

  // Persist on change
  useEffect(() => { writeSave(stats); }, [stats]);
  useEffect(() => {
    try { localStorage.setItem("verbita_dark", dark); } catch {}
  }, [dark]);

  const C = dark ? darkTheme : lightTheme;

  const onCorrect = useCallback((xpAmount, tenseCat) => {
    setStats(prev => {
      const today = new Date().toDateString();
      const isNewDay = prev.lastPracticeDate !== today;
      const newStreak = isNewDay ? prev.streak + 1 : prev.streak;

      const tp = { ...prev.tenseProgress };
      if (tenseCat === "mixed") {
        // Small boost to all
        Object.keys(tp).forEach(k => { tp[k] = Math.min(100, tp[k] + 1); });
      } else if (tp[tenseCat] !== undefined) {
        tp[tenseCat] = Math.min(100, tp[tenseCat] + 5);
      }

      return {
        ...prev,
        xp: prev.xp + xpAmount,
        exercisesDone: prev.exercisesDone + 1,
        streak: newStreak,
        tenseProgress: tp,
        lastPracticeDate: today,
      };
    });
  }, []);

  // Apply theme to body
  useEffect(() => {
    document.body.style.background = C.bg;
    document.body.style.color = C.text;
  }, [dark]);

  return (
    <ThemeContext.Provider value={{ C, dark, setDark }}>
      <div style={{ maxWidth: 420, margin: "0 auto", minHeight: "100vh", position: "relative", paddingBottom: 75, background: C.bg, transition: "background 0.3s ease" }}>
        {/* Top bar */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px 8px", position: "sticky", top: 0, background: C.bg, zIndex: 10, transition: "background 0.3s ease" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 16 }}>\u2764\ufe0f</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: C.pink }}>5</span>
          </div>
          <div style={{ fontSize: 16, fontWeight: 800, color: C.text, letterSpacing: -0.5 }}>\ud83c\udf37 Verbita</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 16 }}>\u2b50</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#DAA520" }}>{stats.xp}</span>
          </div>
        </div>

        {screen === "home" && <HomeScreen onNavigate={setScreen} stats={stats} />}
        {screen === "sentenceBuilder" && <SentenceBuilderScreen onBack={() => setScreen("home")} onCorrect={onCorrect} />}
        {screen === "tenseSpotter" && <TenseSpotterScreen onBack={() => setScreen("home")} onCorrect={onCorrect} />}
        {screen === "chat" && <ChatScreen onBack={() => setScreen("home")} onCorrect={onCorrect} />}
        {screen === "speakCheck" && <SpeakCheckScreen onBack={() => setScreen("home")} onCorrect={onCorrect} />}
        {screen === "duck" && <DuckScreen onBack={() => setScreen("home")} stats={stats} />}

        {/* Bottom nav */}
        <div style={{
          position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
          width: 420, maxWidth: "100%", background: C.card,
          borderTop: `1px solid ${C.bgSoft}`, display: "flex", justifyContent: "space-around",
          padding: "10px 0 20px", boxShadow: `0 -2px 12px ${C.shadow}`, borderRadius: "20px 20px 0 0", zIndex: 10,
          transition: "background 0.3s ease",
        }}>
          {[
            { id: "home", icon: "\ud83c\udfe0", label: "Home" },
            { id: "learn", icon: "\ud83d\udcd6", label: "Learn" },
            { id: "practice", icon: "\ud83c\udfaf", label: "Practice" },
            { id: "duck", icon: "&#129412;", label: "My Duck" },
          ].map(item => (
            <button key={item.id} onClick={() => setScreen(item.id === "duck" ? "duck" : item.id === "learn" ? "learn" : item.id === "practice" ? "practice" : "home")} style={{
              background: "none", border: "none", display: "flex", flexDirection: "column",
              alignItems: "center", gap: 2, opacity: item.id === "home" ? 1 : 0.5,
            }}>
              <span style={{ fontSize: 20 }}>{item.icon}</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: C.text }}>{item.label}</span>
            </button>
          ))}
        </div>
      </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
